# 1. Basic Loop Demonstration

- name: loop demo
  hosts: localhost
  tasks: 
  - name: loop demo
    ansible.builtin.debug:
     msg: "{{ item }}"
    loop:
     - Devops
     - Linux
     - Tarun

# 2. Batch Package Installation

- name: install packages
  hosts: localhost
  become: yes
  tasks: 
  - name: install packages
    ansible.builtin.dnf:
     name: "{{ item }}"
     state: installed
    loop:
     - mysql
     - nginx
     - postfix




