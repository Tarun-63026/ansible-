- name: check the number
  hosts: localhost
  vars_prompt:
  - name: NUMBER
    prompt: Please eneter your number
    private: false
  tasks:
   - name: check if the number less than 10
     ansible.builtin.debug:
      msg: "Give {{NUMBER}} is less than the 10"
     when: NUMBER | int < 10 # filter

   - name: check if the number greater than 10
     ansible.builtin.debug:
      msg: "Give {{NUMBER}} is greater than the 10"
     when: NUMBER | int >= 10 # filter

      