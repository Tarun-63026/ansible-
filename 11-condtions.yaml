- name: conditions
  hosts: web
  become: b
  tasks:
  - name: check if the user exist or not
    ansible.builtin.command: id tarun
    register: USER
    ignore_errors: true
  
  - name: print user information
    ansible.builtin.debug:
     msg: "User info: {{USER}}"
  
  - name: create the user
    ansible.builtin.command: useradd expense
    when: USER.rc != 0

  - name: say hello
    ansible.builtin.debug:
     msg: "Hello everyone"
